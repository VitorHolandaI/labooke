[project]
name = "labooke"
version = "0.0.1"
description = "Local book library + reader with semantic search"
requires-python = ">=3.12,<3.13"
dependencies = [
    "labooke-core",
    "labooke-api",
    "labooke-bible",
]

[project.scripts]
bible = "labooke_bible.cli:app"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
labooke-core = { workspace = true }
labooke-api = { workspace = true }
labooke-bible = { workspace = true }
# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

# ---------- flake8 ----------
[tool.flake8]
max-line-length = 100
extend-ignore = ["E203"]  # conflicts with ruff/black slice formatting

# ---------- mypy (type checking) ----------
[tool.mypy]
python_version = "3.12"
mypy_path = ["packages/core/src", "packages/api/src", "packages/bible/src"]
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
# Third-party libs that ship no type stubs / py.typed marker.
module = ["sqlite_vec", "fitz", "ebooklib", "ebooklib.*"]
ignore_missing_imports = true

# ---------- bandit (security) ----------
[tool.bandit]
exclude_dirs = ["packages/core/tests", "packages/api/tests", "packages/bible/tests", ".venv"]
skips = ["B101", "B608"]  # B101: asserts in tests; B608: parameterized SQL is safe

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "packages/api/tests", "packages/bible/tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
pythonpath = ["packages/core/src", "packages/api/src", "packages/bible/src"]

# ---------- dev deps ----------
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "httpx>=0.27",
    "pylint>=4.0.5",
    "flake8>=7.3.0",
    "bandit>=1.9.4",
    "radon>=6.0.1",
    "vulture>=2.16",
    "mypy>=2.1.0",
]
