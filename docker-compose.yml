services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file:
      - .env
    environment:
      LABOOKE_API_HOST: 0.0.0.0
      LABOOKE_API_PORT: 8000
      LABOOKE_API_RELOAD: "false"
      LABOOKE_DATA_DIR: /data
      LABOOKE_IMPORT_DIR: /data/inbox
      LABOOKE_EMBED_CACHE_MODEL: "false"
      LABOOKE_EMBED_WORKER_IDLE_SECONDS: 60
    ports:
      - "${API_PORT:-8010}:8000"
    volumes:
      - data:/data
      - models:/root/.cache/huggingface
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2g
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  data:
  models:
