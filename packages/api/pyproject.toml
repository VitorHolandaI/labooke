[project]
name = "labooke-api"
version = "0.0.1"
description = "FastAPI HTTP layer for labooke"
requires-python = ">=3.12"
dependencies = [
    "labooke-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "structlog>=24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labooke_api"]

[project.scripts]
labooke-api = "labooke_api.main:run"
