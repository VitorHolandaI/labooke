[project]
name = "labooke-core"
version = "0.0.1"
description = "Core library for labooke: ingest, embed, store, search"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "PyMuPDF>=1.24",
    "EbookLib>=0.18",
    "beautifulsoup4>=4.12",
    "sentence-transformers>=3.0",
    "sqlite-vec>=0.1.6",
    "structlog>=24.0",
    "Pillow>=10.0",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labooke_core"]
